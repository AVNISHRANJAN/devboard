name: CI - Frontend and Backend Validation

on:
  workflow_call:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  frontend:
    name: Frontend quality, SCA, build, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run format:check --if-present
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm test -- --coverage --reporter=default --reporter=junit --outputFile=test-results/frontend.xml
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-reports
          path: |
            frontend/coverage
            frontend/test-results
          if-no-files-found: ignore

  backend:
    name: Backend quality, SCA, build, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: test -z "$(gofmt -l .)"
        working-directory: backend
      - run: go vet ./...
        working-directory: backend
      - run: go test ./... -race -covermode=atomic -coverprofile=coverage.out -json > test-report.json
        working-directory: backend
      - run: go tool cover -func=coverage.out | tee coverage.txt
        working-directory: backend
      - name: Enforce backend coverage floor
        working-directory: backend
        env: {MIN_BACKEND_COVERAGE: '80'}
        run: |
          coverage="$(awk '/total:/ {gsub("%", "", $3); print $3}' coverage.txt)"
          awk -v actual="$coverage" -v minimum="$MIN_BACKEND_COVERAGE" 'BEGIN { exit !(actual >= minimum) }'
      - run: go build ./...
        working-directory: backend
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/test-report.json
            backend/coverage.out
            backend/coverage.txt
          if-no-files-found: ignore
